const data=raw.split('\n').map((x,id)=>{const [name,club,league,area]=x.split('|');return{id:String(id),name,club,league,area}});let visited=[];try{visited=JSON.parse(localStorage.getItem('j-stadium-visited')||'[]')}catch{}let league='ALL';const $=x=>document.getElementById(x);function render(){const q=$('q').value.toLowerCase(),only=$('only').checked;const shown=data.filter(s=>(league==='ALL'||s.league===league)&&(!only||!visited.includes(s.id))&&(s.name+s.club+s.area).toLowerCase().includes(q));$('done').textContent=visited.length;$('total').textContent=data.length;const pct=Math.round(visited.length/data.length*100);$('pct').textContent=pct+'%';$('bar').style.width=pct+'%';$('count').textContent=shown.length+'件';$('items').innerHTML=shown.map(s=>`<button class="stadium ${visited.includes(s.id)?'done':''}" data-id="${s.id}"><span class="check">${visited.includes(s.id)?'✓':''}</span><span class="info"><span class="name">${s.name}</span><span class="club">${s.club} ・ ${s.area}</span></span><span class="badge ${s.league}">${s.league}</span></button>`).join('');document.querySelectorAll('.stadium').forEach(b=>b.onclick=()=>{const id=b.dataset.id;visited=visited.includes(id)?visited.filter(x=>x!==id):[...visited,id];localStorage.setItem('j-stadium-visited',JSON.stringify(visited));render()})}document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{league=b.dataset.l;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));render()});$('q').oninput=render;$('only').onchange=render;render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');
